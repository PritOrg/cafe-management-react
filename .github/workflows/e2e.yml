name: E2E (Playwright) — manual

# Phase P stretch: browser smoke (login -> order -> invoice PDF 200).
# Runs ONLY on workflow_dispatch so it never blocks PRs.
on:
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cafe
          POSTGRES_PASSWORD: cafe
          POSTGRES_DB: cafe
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend up
        working-directory: server
        env:
          DATABASE_URL: postgresql://cafe:cafe@127.0.0.1:5432/cafe
          JWT_SECRET: ci-test-secret
          STORAGE_DRIVER: local
          DEFAULT_TENANT_SLUG: cafe1
        run: |
          npm ci
          npm run db:migrate
          npm run db:seed
          nohup node index.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://localhost:4969/health >/dev/null && break || sleep 2; done

      - name: Frontend build + preview
        working-directory: cafe-management-sys
        env:
          VITE_API_URL: http://localhost:4969/api/v1
        run: |
          npm ci
          npm run build
          nohup npx vite preview --port 4173 --strictPort > /tmp/fe.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173 >/dev/null && break || sleep 2; done

      - name: Run Playwright smoke
        working-directory: cafe-management-sys
        env:
          VITE_API_URL: http://localhost:4969/api/v1
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/smoke.spec.js --reporter=line

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: cafe-management-sys/playwright-report
          retention-days: 7